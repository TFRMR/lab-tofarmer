    <style>
        /* CSS UTAMA TOFARMER */
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter', sans-serif; }
        
        body { background:#0d0d0f; color:#e0e0e0; line-height:1.6; overflow-x: hidden; }
        .container { max-width:1100px; margin:auto; padding:1rem; }

        /* HEADER: LOGO + TEKS SEJAJAR */
        header { text-align:center; padding:2rem 1rem; }
        .header-brand { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 15px; 
            text-decoration: none; 
        }
        .header-logo { 
            height: 80px; 
            width: auto; 
            filter: drop-shadow(0 0 8px rgba(0,242,255,0.6));
        }
        header h1 { 
            font-size: 2.2rem; 
            color: #00f2ff; 
            text-shadow: 0 0 10px #00f2ff; 
            letter-spacing: 1px;
        }

        /* NAVIGASI: TOMBOL NEON ULTRA STABIL */
        nav { 
            display: flex; 
            gap: 15px; 
            align-items: center; 
            justify-content: center; 
            flex-wrap: wrap; 
            padding: 10px; 
            margin-bottom: 1rem; 
        }
        
        .dropdown { 
            position: relative; 
            display: inline-flex; 
            align-items: center; 
            padding-bottom: 15px; 
            margin-bottom: -15px; 
        }
        
        nav a, .dropbtn { 
            text-decoration: none; 
            color: #00f2ff; 
            font-size: 0.85em; 
            font-weight: 600; 
            transition: all 0.3s ease; 
            cursor: pointer; 
            background: rgba(0, 242, 255, 0.05); 
            border: 1px solid rgba(0, 242, 255, 0.3); 
            padding: 10px 22px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        nav a:hover, .dropdown:hover .dropbtn, .dropdown.active .dropbtn { 
            background: rgba(0, 242, 255, 0.2); 
            border-color: #00f2ff; 
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            color: #fff;
            transform: translateY(-2px);
        }

        .dropdown-content { 
            visibility: hidden;
            opacity: 0;
            display: block; 
            position: absolute; 
            background-color: #16161a; 
            min-width: 220px; 
            z-index: 9999 !important;
            border-radius: 12px; 
            top: 50px; 
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0px 10px 30px rgba(0,0,0,0.9);
            padding: 10px;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        /* Logic Tampil lewat Class Active (JS Control) */
        .dropdown.active > .dropdown-content { 
            visibility: visible;
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        
        .dropdown-content a { 
            color: #aaa; 
            padding: 12px 15px; 
            text-decoration: none; 
            display: block; 
            font-size: 0.82em; 
            transition: all 0.2s ease; 
            text-align: left;
            border-radius: 8px;
            margin-bottom: 2px;
            background: transparent;
            border: none;
            text-transform: none;
        }

        .dropdown-content a:hover { 
            background: rgba(0, 242, 255, 0.1); 
            color: #00f2ff; 
            padding-left: 20px;
        }

        .nested-dropdown { 
            position: relative; 
            width: 100%; 
            padding-right: 15px; 
            margin-right: -15px;
        }

        .nested-content { 
            visibility: hidden;
            opacity: 0;
            display: block;
            position: absolute; 
            left: 100%; 
            top: -10px; 
            background-color: #1a1a20; 
            min-width: 230px; 
            border-radius: 12px; 
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 10px 10px 30px rgba(0,0,0,0.7); 
            padding: 10px;
            transition: all 0.3s ease;
            transform: translateX(10px);
        }
        
        .nested-dropdown:hover > .nested-content { 
            visibility: visible;
            opacity: 1;
            transform: translateX(0);
        }

        .nested-parent::after {
            content: " »";
            opacity: 0.5;
        }

        /* PENYESUAIAN MEDSOS & ESTETIKA BARU */
        .app-display { width: 100%; margin-top: 20px; }

        /* Gaya Kartu Glassmorphism */
        .tof-card {
            background: rgba(22, 22, 26, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
            transition: transform 0.3s ease, border 0.3s ease;
        }
        .tof-card:hover {
            transform: translateY(-5px);
            border: 1px solid rgba(0, 242, 255, 0.4);
        }

        @keyframes pulse-cyan {
            0% { box-shadow: 0 0 5px rgba(0, 242, 255, 0.2); }
            50% { box-shadow: 0 0 15px rgba(0, 242, 255, 0.5); }
            100% { box-shadow: 0 0 5px rgba(0, 242, 255, 0.2); }
        }
        .header-logo { animation: pulse-cyan 4s infinite ease-in-out; }

        /* FOOTER */
        .custom-footer-tofarmer { 
            text-align: center; 
            margin-top: 50px; 
            padding: 20px; 
            font-family: monospace; 
            font-size: 12px; 
            color: #8affff; 
            opacity: 0.7; 
        }

        /* RESPONSIF HP */
        @media screen and (max-width: 850px) {
            header h1 { font-size: 1.6rem; }
            nav { gap: 10px; padding: 10px; }
            .dropdown-content { position: static; transform: none; width: 100%; opacity: 1; visibility: visible; display: none; }
            .dropdown.active .dropdown-content { display: block; }
            .nested-content { position: static; transform: none; visibility: visible; opacity: 1; display: none; background: rgba(0,0,0,0.2); }
            .nested-dropdown:hover .nested-content { display: block; }
        }

        /* WA FLOATING */
        .wa-float { position: fixed; width: 60px; height: 60px; bottom: 20px; right: 20px; background-color: #25d366; color: #FFF; border-radius: 50px; text-align: center; font-size: 30px; box-shadow: 0 0 15px rgba(0,0,0,0.3); z-index: 1000; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: all 0.3s ease; animation: pulse-wa 2s infinite; }
        @keyframes pulse-wa { 0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); } }
    </style>
</head>

    <script>
        // FUNGSI TOGGLE DROPDOWN CERDAS
        function toggleMenu(event, btn) {
            event.stopPropagation(); // Mencegah event bubbling ke window
            const parent = btn.parentElement;
            
            // Cek apakah menu ini sudah terbuka
            const isOpen = parent.classList.contains('active');

            // Tutup semua dropdown yang sedang terbuka (biar rapi)
            document.querySelectorAll('.dropdown').forEach(dropdown => {
                dropdown.classList.remove('active');
            });

            // Jika sebelumnya tertutup, sekarang buka (Toggle ON)
            // Jika sebelumnya sudah buka, maka baris di atas sudah menutupnya (Toggle OFF)
            if (!isOpen) {
                parent.classList.add('active');
            }
        }

        // Klik di mana saja di luar menu untuk menutup
        window.onclick = function(event) {
            if (!event.target.matches('.dropbtn')) {
                document.querySelectorAll('.dropdown').forEach(dropdown => {
                    dropdown.classList.remove('active');
                });
            }
        }
    </script>
