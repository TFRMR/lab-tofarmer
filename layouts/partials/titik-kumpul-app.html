<style>
    /* LAYOUT UTAMA WEB */
    .medsos-layout {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 25px;
        align-items: start;
    }

    /* Social Proof yang lebih ramping dan ramah (Adaptif untuk HP) */
    .social-lite-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        background: rgba(0, 242, 255, 0.03);
        border: 1px solid rgba(0, 242, 255, 0.1);
        border-radius: 12px;
        margin-bottom: 15px;
        font-size: 0.8rem;
        gap: 15px;
        overflow: hidden;
    }

    /* KONTEN FOTO BERTUMPUK DENGAN FITUR GULIR MANUAL INFINITY */
    #grower-photos {
        display: flex;
        align-items: center;
        gap: -12px; 
        overflow-x: auto; 
        overflow-y: hidden;
        max-width: 400px; 
        padding: 10px 5px;
        scrollbar-width: none; 
        -ms-overflow-style: none; 
        cursor: grab;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
        flex-shrink: 1;
    }

    #grower-photos::-webkit-scrollbar {
        display: none; 
    }

    #grower-photos:active {
        cursor: grabbing;
    }

    .mini-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 2px solid #0d0d0f;
        background: #16161a;
        object-fit: cover;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        cursor: pointer;
        flex-shrink: 0; 
        margin-left: -12px;
    }

    .mini-avatar:first-child {
        margin-left: 0;
    }

    .mini-avatar:hover {
        transform: scale(1.4) translateY(-5px);
        z-index: 999 !important;
        box-shadow: 0 5px 15px rgba(0, 242, 255, 0.4);
        margin-right: 12px; 
    }

    .avatar-elite {
        width: 42px !important;   
        height: 42px !important;
        border-color: #ff00ff !important; 
        box-shadow: 0 0 12px rgba(255, 0, 255, 0.6);
        z-index: 10;
    }
    
    .avatar-elite:hover {
        box-shadow: 0 5px 20px rgba(255, 0, 255, 0.8);
    }

    /* INDIKATOR EKONOMI TOFARMER */
    .economy-bar {
        background: linear-gradient(90deg, rgba(255, 0, 255, 0.05), rgba(0, 242, 255, 0.05));
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 12px;
        padding: 15px;
        margin-bottom: 25px;
        display: flex;
        justify-content: space-around;
        text-align: center;
    }
    .econ-item { display: flex; flex-direction: column; gap: 5px; }
    .econ-label { font-size: 0.6rem; color: #666; letter-spacing: 1px; text-transform: uppercase; }
    .econ-value { font-size: 1.1rem; color: #fff; font-weight: bold; font-family: monospace; }
    .econ-symbol { color: #00f2ff; font-size: 0.7rem; margin-left: 5px; }

    /* Kolom Tengah: Feed (DIBATASI MAKSIMAL 3 POSTINGAN NYAMAN DI WEB, SELEBIHNYA INTERNAL SCROLL) */
    .feed-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        max-height: 750px; 
        overflow-y: auto;
        padding-right: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 0, 255, 0.2) transparent;
    }

    /* Gaya scrollbar modern untuk Chrome/Safari */
    .feed-container::-webkit-scrollbar {
        width: 6px;
    }
    .feed-container::-webkit-scrollbar-thumb {
        background: rgba(255, 0, 255, 0.2);
        border-radius: 3px;
    }

    .post-card {
        background: rgba(28, 28, 33, 0.6);
        border-radius: 15px;
        padding: 20px;
        border-left: 4px solid #ff00ff;
        transition: 0.3s;
    }

    .post-card:hover {
        background: rgba(35, 35, 40, 0.8);
    }

    .post-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        font-size: 0.8rem;
    }

    .user-id { 
        color: #00f2ff; 
        font-weight: bold; 
        text-decoration: none;
        transition: 0.2s;
    }
    .user-id:hover {
        text-shadow: 0 0 8px #00f2ff;
        color: #fff;
    }

    .post-time { color: #555; }
    .post-text { color: #d1d1d1; font-size: 0.95rem; }

    .interaction-bar {
        display: flex;
        gap: 20px;
        margin-top: 15px;
        padding-top: 10px;
        border-top: 1px solid rgba(255,255,255,0.05);
    }

    .btn-interact {
        background: none;
        border: none;
        color: #666;
        cursor: pointer;
        font-size: 0.8rem;
        display: flex;
        align-items: center;
        gap: 5px;
        transition: 0.2s;
    }

    .btn-interact:hover { color: #00f2ff; }

    /* INPUT & BUTTON STYLING (FIX KEYBOARD HP: Hilangkan bentrokan z-index/pointer-events) */
    .tof-input, 
    .komentar-box-section input {
        width: 100% !important;   
        display: block !important; 
        box-sizing: border-box;   
        padding: 14px 12px;        
        margin-bottom: 15px;       
        border-radius: 8px;
        font-size: 1rem;          
        outline: none;
        border: 1px solid #333;
        background: #0d0d0f;
        color: #fff;
        position: relative !important;
        z-index: 5 !important;
        pointer-events: auto !important;
    }

    .tof-input::placeholder { color: #666; }
    .tof-input:focus { border-color: #00f2ff; box-shadow: 0 0 8px rgba(0, 242, 255, 0.2); }

    .side-widget {
        margin-bottom: 25px;
        width: 100%;
        max-width: 320px;
    }

    /* KONTANER DUST UTK TAMPILAN STRUKTUR TARGET FASE DI KIRI ATAS WEB */
    .fase-widget-box {
        margin-bottom: 25px;
        width: 100%;
    }

    /* 📱 ARSITEKTUR RESPONSIVE STRATEGY KHUSUS SMARTPHONE (HAPE) */
    @media (max-width: 850px) {
        .medsos-layout { 
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        
        /* URUTAN SAKLAR STRUKTUR HP MANDAT MASTERMIND:
           1. Total Aset Ekonomi (tetap di paling atas via div luar)
           2. Target Fase kemajuan aset 
           3. Tombol Login/Dashboard Web3 Address
           4. Kolom Linimasa Feed Tengah
        */
        .fase-widget-box {
            order: 1 !important; /* Target Fase tampil urutan ke-2 setelah bar ekonomi */
            margin-bottom: 15px;
        }

        #user-profile-card-container {
            order: 2 !important; /* Tombol Gerbang Login tampil urutan ke-3 */
            max-width: 100%;
            margin-bottom: 20px;
        }

        .feed-container { 
            order: 3 !important; /* Kolom Feed Utama tampil paling bawah */
            width: 100%;
            max-height: none; /* Di HP biarkan scroll layar utama agar tidak kaku */
            margin-top: 10px; 
        }

        .desktop-only-info { display: none; }
        .economy-bar { flex-direction: column; gap: 15px; padding: 10px; }
        .social-lite-bar { flex-direction: column; gap: 10px; text-align: center; padding: 15px; }
        #grower-photos { max-width: 100%; justify-content: center; }
        
        .stat-badge-container {
            width: 100%;
            background: rgba(13,13,15,0.9);
            padding: 8px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }
    }
</style>

<div class="social-lite-bar">
    <div id="grower-photos"></div>
    <div class="stat-badge-container">
        <a href="{{ "" | relURL }}" style="text-decoration: none; color: #00f2ff; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap;">
            📡 <span>Ekosistem: <b id="count-growers">0</b> Growers + <b id="count-elite" style="color:#ff00ff;">0</b> Elite</span> 
        </a>

</div>

<div class="economy-bar">
    <div class="econ-item">
        <span class="econ-label">Total Aset Ekosistem</span>
        <div class="econ-value" id="total-asset">0.00 <span class="econ-symbol">TOF</span></div>
    </div>
</div>

<div class="medsos-layout">
    
    <div style="display: flex; flex-direction: column; width: 100%;">
        
        <div class="fase-widget-box">
            <div class="tof-card">
                <h4 id="fase-title-label" style="font-size: 0.7rem; color: #00f2ff; letter-spacing: 2px; margin-bottom: 12px; text-transform: uppercase;">MEMUAT TARGET FASE...</h4>
                <div style="background: rgba(0,0,0,0.5); height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 10px;">
                    <div id="fase-progress-bar" style="width: 0%; height: 100%; background: linear-gradient(90deg, #00f2ff, #ff00ff); transition: width 0.5s ease;"></div>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.7rem;">
                    <span id="fase-status-text">Kalkulasi Aset Node</span>
                    <span id="fase-percent-text" style="color: #ff00ff; font-weight: bold;">0%</span>
                </div>
            </div>
        </div>

        <div class="side-widget" id="user-profile-card-container">
            <div class="tof-card" id="user-profile-card">
                <div id="login-form">

                    <button id="btn-connect-wallet" onclick="eksekusiLoginWallet()" style="background: #00f2ff; color: #000; border: none; font-weight: bold; cursor: pointer; font-size: 0.75rem; padding: 14px 12px; width: 100%; border-radius: 8px; margin-bottom: 5px;">

                    </button>

                    <div id="slot-daftar-otomatis" style="display: none; border-top: 1px dashed rgba(0, 242, 255, 0.2); padding-top: 15px; margin-top: 15px;">
                        <p style="font-size: 0.65rem; color: #ff00ff; text-align: center; margin-bottom: 12px; font-weight: bold; line-height: 1.4;">
                            ⚠️ DOMPET BELUM DIKENALI!<br>SILAHKAN AMBIL SLOT IDENTITAS WARGA BARU:
                        </p>
                        <input type="text" id="reg-username" placeholder="Buat Username (Misal: KAPTEN_KOPI)" class="tof-input" style="text-transform: uppercase;">
                        <input type="text" id="reg-nama-asli" placeholder="Masukkan Nama Asli Anda" class="tof-input">

                <div id="user-dashboard" style="display: none;">

                        <img id="user-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                        <span id="profile-icon" style="font-size: 2rem;">👤</span>
                    </div>
                    <div style="text-align: center;">
                        <h3 id="display-name" style="color: #00f2ff; font-size: 1.1rem;">Visitor</h3>
                        <p id="display-role" style="font-size: 0.7rem; color: #666; letter-spacing: 1px; margin-bottom: 10px;">GUEST</p>
                        
                        <div class="desktop-only-info" style="margin-top: 15px; text-align: left; font-size: 0.8rem; width: 100%;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #aaa;">XP:</span>
                                <span id="user-xp" style="color: #ff00ff; font-weight: bold;">0</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                                <span style="color: #aaa;">Saldo:</span>
                                <span id="user-tof" style="color: #00f2ff; font-weight: bold;">0 TOF</span>

                        <div id="web3-connection-area" style="margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
                            <button id="btn-connect" style="background: rgba(0, 242, 255, 0.1); border: 1px solid #00f2ff; color: #00f2ff; font-size: 0.7rem; font-weight: bold; cursor: default; width:100%; border-radius:8px; padding:10px;">
                                🔗 WALLET CONNECTED
                            </button>
                        </div>

                        <button onclick="logout()" style="margin-top: 15px; background: rgba(255,0,0,0.1); border: 1px solid #ff4757; color: #ff4757; cursor: pointer; font-size: 0.65rem; font-weight: bold; width:100%; padding:10px; border-radius:8px;">
                            KELUAR
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="feed-container">
        <div class="tof-card" style="padding: 15px; border-style: dashed; border-color: rgba(255,0,255,0.2); width:100%; box-sizing:border-box;">
            <textarea id="main-post-area" placeholder="Silahkan Login untuk mulai membagikan progres..." style="width: 100%; background: transparent; border: none; color: #fff; outline: none; resize: none; min-height: 60px; font-size:1rem; position:relative; z-index:10; pointer-events:auto;"></textarea>
            <div style="display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-top: 10px;">
                <span id="post-status-msg" style="font-size: 0.65rem; color: #666;">Status: Login Required</span>
                <button id="btn-post" style="background: #00f2ff; color: #000; border: none; padding: 8px 20px; border-radius: 5px; font-weight: bold; font-size: 0.7rem; cursor: pointer;">KIRIM</button>
            </div>
        </div>
    </div>

</div>

<script src="{{ "js/app-logic.js?v=1.5" | relURL }}"></script>

<script>
    /**
     * 🚀 RITUAL EMBED API SUNTIK FEED: MEDSOS OTONOM INTERAKTIF
     */
    document.addEventListener('DOMContentLoaded', () => {
        const tombolKirim = document.getElementById('btn-post');
        const kotakTulisan = document.getElementById('main-post-area');
        const statusMsg = document.getElementById('post-status-msg');

        const walletSession = localStorage.getItem('tof_session_wallet');
        if (walletSession && statusMsg && kotakTulisan && tombolKirim) {
            const idWarga = document.getElementById('display-name')?.innerText || "@CYBER_FARMER";
            statusMsg.innerText = "Status: Terhubung via Dompet " + idWarga;
            statusMsg.style.color = "#00f2ff";
            kotakTulisan.placeholder = "Tulis progres praktek ekosistem Anda di sini...";
            
            tombolKirim.style.background = "#00f2ff";
            tombolKirim.style.color = "#000";
            tombolKirim.style.cursor = "pointer";
        }

        if (tombolKirim && kotakTulisan) {
            tombolKirim.addEventListener('click', async () => {
                const isiTeks = kotakTulisan.value.trim();
                const sessionAktif = localStorage.getItem('tof_session_wallet');

                if (!sessionAktif) {
                    alert("⚠️ Gerbang Otentikasi Terkunci! Silahkan hubungkan dompet Algorand Anda terlebih dahulu.");
                    return;
                }

                if (!isiTeks) {
                    alert("⚠️ Kotak tulisan tidak boleh kosong, Mas Mastermind!");
                    return;
                }

                tombolKirim.innerText = "PROSES...✍️";
                tombolKirim.disabled = true;

                const suksesLive = await kirimKontribusiPostBaru(isiTeks);

                if (suksesLive) {
                    // DIJELASKAN KEPADA WARGA SESUAI MANDAT ESTETIKA MASTERMIND
                    alert("📡 KONTRIBUSI MASUK ANTRIAN!\n\nNota progres Anda sedang dalam proses verifikasi & sinkronisasi oleh Node validator ekosistem ToFarmer.\n\nMohon tunggu sekitar 1 menit agar data muncul secara permanen di linimasa mading.");
                    setTimeout(() => { if (typeof loadFeedTengah === 'function') loadFeedTengah(); }, 2000);
                } else {
                    alert("⚠️ Pipa pengiriman data API terhambat! Pastikan string kunci Token ghp_ di app-logic.js sudah terisi dengan benar ya, Mas.");
                }

                kotakTulisan.value = "";
                tombolKirim.innerText = "KIRIM";
                tombolKirim.disabled = false;
            });
        }
    });
</script>
